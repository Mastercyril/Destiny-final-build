<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny World 3D - Living World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 6px 14px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Destiny World 3D &mdash; Drag to orbit &bull; Scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ── Scene / Camera / Renderer ──────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 200);

        const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ── Orbit Controls ─────────────────────────────────────────────────
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 120;
        controls.maxPolarAngle = Math.PI / 2.05;

        // ── Lighting ───────────────────────────────────────────────────────
        const ambient = new THREE.AmbientLight(0xffeedd, 0.6);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xfffbe8, 1.4);
        sun.position.set(60, 80, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 300;
        sun.shadow.camera.left = -80;
        sun.shadow.camera.right = 80;
        sun.shadow.camera.top = 80;
        sun.shadow.camera.bottom = -80;
        scene.add(sun);

        // Sun sphere (visual)
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(3, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xFFFF88 })
        );
        sunMesh.position.set(60, 80, 40);
        scene.add(sunMesh);

        // ── Ground ─────────────────────────────────────────────────────────
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200, 40, 40),
            new THREE.MeshLambertMaterial({ color: 0x4CAF50 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ── Mountains ──────────────────────────────────────────────────────
        function makeMountain(x, z, h, r) {
            const geo = new THREE.ConeGeometry(r, h, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0x7B6F5A });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, h / 2, z);
            m.castShadow = true;
            scene.add(m);
            // snow cap
            const snow = new THREE.Mesh(
                new THREE.ConeGeometry(r * 0.35, h * 0.25, 8),
                new THREE.MeshLambertMaterial({ color: 0xffffff })
            );
            snow.position.set(x, h * 0.87, z);
            scene.add(snow);
        }
        makeMountain(-60, -50, 40, 18);
        makeMountain(-40, -70, 30, 14);
        makeMountain(55, -55, 45, 20);
        makeMountain(75, -40, 28, 12);
        makeMountain(10, -80, 36, 16);

        // ── River ──────────────────────────────────────────────────────────
        const riverGeo = new THREE.PlaneGeometry(10, 80);
        const riverMat = new THREE.MeshPhongMaterial({
            color: 0x1E90FF,
            transparent: true,
            opacity: 0.75,
            shininess: 120
        });
        const river = new THREE.Mesh(riverGeo, riverMat);
        river.rotation.x = -Math.PI / 2;
        river.position.set(-8, 0.05, -10);
        river.rotation.z = 0.15;
        river.receiveShadow = true;
        scene.add(river);

        // ── Trees ──────────────────────────────────────────────────────────
        function makeTree(x, z, h) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.35, h * 0.4, 8),
                new THREE.MeshLambertMaterial({ color: 0x5C3A1E })
            );
            trunk.position.set(x, h * 0.2, z);
            trunk.castShadow = true;
            scene.add(trunk);
            const foliage = new THREE.Mesh(
                new THREE.ConeGeometry(h * 0.35, h * 0.75, 8),
                new THREE.MeshLambertMaterial({ color: 0x2E7D32 })
            );
            foliage.position.set(x, h * 0.65, z);
            foliage.castShadow = true;
            scene.add(foliage);
        }
        const treePositions = [
            [8,2],[12,-3],[16,5],[-12,4],[-16,-2],[-20,6],
            [5,-8],[18,-10],[-10,-12],[22,0],[25,8],[-25,-5],
            [30,-15],[35,5],[-30,10],[3,15],[-5,18],[10,20]
        ];
        treePositions.forEach(([x,z]) => makeTree(x, z, 4 + Math.random() * 3));

        // ── Clouds ─────────────────────────────────────────────────────────
        const clouds = [];
        function makeCloud(x, y, z) {
            const group = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            [[0,0,0,2.5],[2.2,0.5,0,1.8],[-2.2,0.3,0,1.8],[1,0.8,0,1.4],[-1,0.9,0,1.3]].forEach(([cx,cy,cz,r]) => {
                const c = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 10), mat);
                c.position.set(cx, cy, cz);
                group.add(c);
            });
            group.position.set(x, y, z);
            scene.add(group);
            clouds.push(group);
        }
        makeCloud(-20, 35, -30);
        makeCloud(15, 38, -45);
        makeCloud(40, 32, -20);
        makeCloud(-45, 36, -10);
        makeCloud(0, 40, -60);
        makeCloud(60, 34, -35);

        // ── Birds (simple V shapes) ────────────────────────────────────────
        const birds = [];
        function makeBird(x, y, z) {
            const geo = new THREE.BufferGeometry();
            const verts = new Float32Array([-1.2, 0, 0, 0, 0.4, 0, 1.2, 0, 0]);
            geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            const mat = new THREE.LineBasicMaterial({ color: 0x111111 });
            const bird = new THREE.Line(geo, mat);
            bird.position.set(x, y, z);
            birds.push(bird);
            scene.add(bird);
        }
        for (let i = 0; i < 12; i++) {
            makeBird((Math.random() - 0.5) * 80, 28 + Math.random() * 10, -20 - Math.random() * 40);
        }

        // ── Resize handler ─────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // ── Animation loop ─────────────────────────────────────────────────
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Drift clouds
            clouds.forEach((c, i) => {
                c.position.x += 0.015 * (i % 2 === 0 ? 1 : -0.7);
                if (c.position.x > 80) c.position.x = -80;
                if (c.position.x < -80) c.position.x = 80;
            });

            // Animate birds
            birds.forEach((b, i) => {
                b.position.x += 0.05 * (i % 3 === 0 ? -1 : 1);
                b.position.y = b.position.y + Math.sin(t * 1.5 + i) * 0.005;
                if (b.position.x > 80) b.position.x = -80;
                if (b.position.x < -80) b.position.x = 80;
            });

            // Ripple river
            riverMat.opacity = 0.6 + 0.15 * Math.sin(t * 2);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
